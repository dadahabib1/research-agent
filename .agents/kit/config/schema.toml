# ---------------------------------------------------------------- [merge]

[key."merge.clean_run"]
file = "project"
type = "string-list"
default = []
labels = ["your value"]
doc = "The clean run, one command as an argv list: the offline suite plus the free live tests, run on every merge result and on main after it; empty refuses every merge (decision 66; C8 section 7)."
added_in = "v0.1.0"

[key."merge.run_timeout_minutes"]
file = "project"
type = "integer"
min = 1
default = 30
labels = ["your value"]
doc = "Minutes a clean run may take; a run that does not finish is red and its process tree is killed (C8 section 7)."
added_in = "v0.1.0"

[key."merge.paid_suite"]
file = "project"
type = "string-list"
default = []
labels = ["your value"]
doc = "The paid suite, an argv list run once after a merge that touches merge.paid_paths, after the merge lock is released (decisions 66, 113)."
added_in = "v0.1.0"

[key."merge.paid_paths"]
file = "project"
