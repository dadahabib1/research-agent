# The config schema and the kit's defaults: one file, one copy (contract C3).
# Every setting a project can have is one [key."<dotted.name>"] table here. The rules this file does
# not express as data (precedence, cross-field checks, error format) are in agent-kit's
# docs/contracts/C3-config.md. A setting without `default` is required and is written at bootstrap.
#
# Fields per key:
#   file      "project" (agent-kit.toml, committed) or "local" (agent-kit.local.toml, this machine)
#   type      string | integer | float | boolean | string-list | path | path-list | glob-list
#   default   the kit default; absent means required
#   choices   the name of a list in [fixed] the value must come from (for lists: every item)
#   allowed   an inline list of allowed values
#   min, max  bounds for integer and float
#   pattern   a regular expression a string must match in full
#   labels    how the default was chosen, from fixed.labels (decision 81, rule 1)
#   doc       the one-line comment written above the setting
#   added_in  the kit release that added the key (the update report lists keys newer than the project)

format = "config-schema"
version = 1

[fixed]
# Not settings: changing any of these is a kit release.
# Always-yours paths: a PR touching any of them is yours to merge (decisions 70, 83).
# `.agents/**` covers the kit's scripts (C1). tickets.your_paths can only add to this list.
control_paths = ["AGENTS.md", "CLAUDE.md", ".claude/**", ".agents/**", ".codex/**", "kit.lock", "agent-kit.toml"]
labels = ["measured", "ran", "reported", "replayed", "judgment", "your value"]
efforts = ["low", "medium", "high", "xhigh", "max"]
# Pinned model IDs (decision 35). A model not listed here is refused; adding one is a kit release.
claude_models = ["claude-opus-5-5", "claude-sonnet-5-5", "claude-haiku-5-5", "claude-fable-5-1"]
codex_models = ["gpt-6-astra", "gpt-6.1-sol"]
# Claude's context window in tokens, for the context barrier's percent (C5 section 3): 1,000,000 for
# every pinned Claude model (Anthropic's models overview).
claude_context_window = 1000000

[header]
project = [
  "agent-kit.toml: every setting for this project, in one place (committed).",
  "Changing a value here is a PR you merge. Machine-only values live in agent-kit.local.toml.",
  "Labels say how each default was chosen: measured, ran, reported, replayed, judgment, your value.",
]
local = [
  "agent-kit.local.toml: this computer only (never committed).",
]

# ---------------------------------------------------------------- [project]

[key."project.name"]
file = "project"
type = "string"
pattern = "[a-z0-9][a-z0-9_-]*"
labels = ["your value"]
doc = "The project's name; also the prefix of every session name (decision 52). Bootstrap offers the folder name."
added_in = "v0.1.0"

[key."project.high_stakes"]
file = "project"
type = "string-list"
default = []
labels = ["judgment"]
doc = "What the orchestrator may never decide alone (decision 58): changes touching these go to you. Bootstrap asks."
added_in = "v0.1.0"

# ---------------------------------------------------------------- [sessions]

[key."sessions.orchestrator.model"]
file = "project"
type = "string"
choices = "claude_models"
default = "claude-opus-5-5"
labels = ["ran"]
doc = "Model the orchestrator starts with."
added_in = "v0.1.0"

[key."sessions.orchestrator.effort"]
file = "project"
type = "string"
choices = "efforts"
default = "high"
labels = ["ran"]
doc = "Effort the orchestrator starts with."
added_in = "v0.1.0"

[key."sessions.builder.model"]
file = "project"
type = "string"
choices = "claude_models"
default = "claude-opus-5-5"
labels = ["ran"]
doc = "Model a builder starts with."
added_in = "v0.1.0"

[key."sessions.builder.effort"]
file = "project"
type = "string"
choices = "efforts"
default = "xhigh"
labels = ["ran"]
doc = "Effort a builder starts with; a brief may raise it for one ticket, with the reason, and \"max\" only with your OK (decision 63)."
added_in = "v0.1.0"

[key."sessions.triager.model"]
file = "project"
type = "string"
choices = "claude_models"
default = "claude-opus-5-5"
labels = ["judgment"]
doc = "Model of the triager, the one call after each review round that gives each finding a verdict (decisions 33, 34, 73)."
added_in = "v0.1.0"

[key."sessions.triager.effort"]
file = "project"
type = "string"
choices = "efforts"
default = "high"
labels = ["judgment"]
doc = "Effort of the triager."
added_in = "v0.1.0"

[key."sessions.reader.model"]
file = "project"
type = "string"
choices = "claude_models"
default = "claude-opus-5-5"
labels = ["judgment"]
doc = "Model of the read-only helper (decisions 27, 60)."
added_in = "v0.1.0"

[key."sessions.reader.effort"]
file = "project"
type = "string"
choices = "efforts"
default = "high"
labels = ["judgment"]
doc = "Effort of the read-only helper."
added_in = "v0.1.0"

[key."sessions.max_builders"]
file = "project"
type = "integer"
min = 1
default = 1
labels = ["ran"]
doc = "How many builders run at once, below the memory floor (decision 46); an escalated builder waiting idle does not count (decision 123)."
added_in = "v0.1.0"

[key."sessions.escalation_wait_hours"]
file = "project"
type = "float"
min = 0
default = 8.0
labels = ["your value"]
doc = "Hours an escalated builder waits idle, its cache kept warm, before it hands off; 0 hands off at once (decision 123)."
added_in = "v0.1.0"

# ---------------------------------------------------------------- [reviewer]

