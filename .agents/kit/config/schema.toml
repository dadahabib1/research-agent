[key."tickets.auto_merge"]
file = "project"
type = "boolean"
default = false
labels = ["your value"]
doc = "The orchestrator merges ticket PRs once earned. Off until you turn it on, after the adoption tests and the behaviour suite pass (decisions 70, 87; C8 section 2)."
added_in = "v0.1.0"

[key."tickets.earn_after"]
file = "project"
type = "integer"
min = 1
default = 3
labels = ["your value"]
doc = "Clean ticket merges by you before the orchestrator may merge ticket PRs itself (decision 70)."
added_in = "v0.1.0"

[key."tickets.hand_back_after_escalations"]
file = "project"
type = "integer"
min = 1
default = 3
labels = ["your value"]
doc = "Escalations in a row that hand self-merge back to you; a revert or a red main also does (decision 70)."
