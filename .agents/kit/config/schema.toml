[key."tickets.your_paths"]
file = "project"
type = "glob-list"
default = ["docs/spec/**", "docs/adr/**", "docs/agents/**"]
labels = ["your value"]
doc = "Paths whose PRs are always yours, added to the kit's fixed control paths, which cannot be removed (decisions 70, 83, 96)."
